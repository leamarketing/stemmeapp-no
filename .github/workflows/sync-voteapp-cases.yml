name: Sync published VoteApp cases

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"
  push:
    branches: [main]
    paths:
      - "scripts/sync-cases.mjs"
      - "scripts/sync-participation.mjs"
      - "scripts/apply-external-links.mjs"
      - "scripts/public-content.mjs"
      - "data/participation-opportunities.json"
      - "external-links.js"
      - ".github/workflows/sync-voteapp-cases.yml"

permissions:
  contents: read

concurrency:
  group: sync-voteapp-cases
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out site
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"

      - name: Verify public-content boundaries
        run: node --test tests/security.test.mjs

      - name: Generate case pages
        run: node scripts/sync-cases.mjs

      - name: Generate participation page
        run: node scripts/sync-participation.mjs

      - name: Apply external-link behavior
        run: node scripts/apply-external-links.mjs

      - name: Commit changes
        run: |
          git config user.name "stemmeapp-case-sync"
          git config user.email "actions@users.noreply.github.com"
          git add '*.html' saker paavirk data sitemap.xml
          if git diff --cached --quiet; then
            echo "No published-case changes."
            exit 0
          fi
          git commit -m "Sync published VoteApp case pages"
          git push
