name: Sync published VoteApp cases

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"
  push:
    paths:
      - "scripts/sync-cases.mjs"
      - "scripts/sync-participation.mjs"
      - "scripts/apply-external-links.mjs"
      - "data/participation-opportunities.json"
      - "external-links.js"
      - ".github/workflows/sync-voteapp-cases.yml"

permissions:
  contents: write

concurrency:
  group: sync-voteapp-cases
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate case pages
        run: node scripts/sync-cases.mjs

      - name: Generate participation page
        run: node scripts/sync-participation.mjs

      - name: Apply external-link behavior
        run: node scripts/apply-external-links.mjs

      - name: Commit changes
        run: |
          git config user.name "stemmeapp-case-sync"
          git config user.email "actions@users.noreply.github.com"
          git add '*.html' saker paavirk data sitemap.xml
          if git diff --cached --quiet; then
            echo "No published-case changes."
            exit 0
          fi
          git commit -m "Sync published VoteApp case pages"
          git push
